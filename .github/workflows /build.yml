name: build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '发版标签（例如 v0.0.1），留空则只构建不发布'
        required: false
        default: 'v0.0.1'
  push:
    tags:
      - 'v*'

# 内核来源：想换 fork 或版本只改 mihomo/Makefile 里的 PKG_SOURCE_URL / PKG_SOURCE_VERSION
env:
  FEEDNAME: homi

jobs:
  # 每个分支的 SDK 原生打出对应格式的包，
  # 24.10 出 ipk（opkg），25.12 出 apk，不做格式转换。
  build-packages:
    name: packages ${{ matrix.arch }} ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x86_64
          - aarch64_cortex-a53
          - aarch64_cortex-a72
          - aarch64_generic
          - arm_cortex-a7_neon-vfpv4
        branch:
          - openwrt-24.10
          - openwrt-25.12
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}-${{ matrix.branch }}
          FEEDNAME: homi
          PACKAGES: mihomo homi luci-app-homi
          NO_REFRESH_CHECK: true

      - name: bundle
        run: |
          # 24.10 产出 ipk，25.12 产出 apk；直接打包 SDK 原生产物
          if [ "${{ matrix.branch }}" = "openwrt-24.10" ]; then ext=ipk; else ext=apk; fi
          tar -c -z -f "homi-${{ matrix.arch }}-$ext.tar.gz" \
            -C "bin/packages/${{ matrix.arch }}/homi" .
          tar -tzf "homi-${{ matrix.arch }}-$ext.tar.gz"

      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.arch }}-${{ matrix.branch }}
          path: homi-${{ matrix.arch }}-*.tar.gz

  # 打 tag（v*）或手动触发（release_tag）后：把 10 个下载包发布到 GitHub Release，
  # 在 Release 页面直接下载（5 架构 × ipk/apk）。
  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    needs: build-packages
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: download bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist

      - name: list
        run: ls -lh dist/

      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          # 手动触发时用输入的标签（action 会自动建 tag），tag 推送时用当前标签
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/*.tar.gz
          generate_release_notes: true
          # Release 已存在时重跑补传：同名文件直接覆盖
          overwrite_files: true
